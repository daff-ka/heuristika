        (function () {
            try {
                var stored = localStorage.getItem('heuristika-theme');
                var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <script>
        (function () {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            const root = document.documentElement;

            function sync() {
                btn.setAttribute('aria-pressed', String(root.getAttribute('data-theme') === 'light'));
            }
            sync();

            btn.addEventListener('click', () => {
                const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
                root.setAttribute('data-theme', next);
                try { localStorage.setItem('heuristika-theme', next); } catch (e) { }
                sync();
            });
        })();
    </script>

    <script>
        (function () {
            // Te same wpisy co w sekcji "Ostatnio dodane" na stronie głównej —
            // tylko te, które mają własną podstronę, od najnowszego.
            const KATALOG_ENTRIES = [
                {
                    title: 'Baner cookies zgodny z wytycznymi EROD',
                    desc: 'Co EROD mówi o banerach cookies i dlaczego „Odrzuć” musi być tuż obok „Akceptuj”?',
                    tags: { dyscyplina: 'UX Design', typ: 'Wzorzec', platforma: 'Web + Mobile', poziom: 'Średni' },
                    url: 'wpis-baner-cookies.html',
                    icon: 'entry-cookie',
                },
                {
                    title: 'LCP: kiedy użytkownik widzi treść',
                    desc: 'Kiedy użytkownik widzi główną treść strony i co ma do tego makieta?',
                    tags: { dyscyplina: 'Web Development', typ: 'Termin', platforma: 'Web', poziom: 'Średni' },
                    url: 'wpis-lcp.html',
                    icon: 'entry-bolt',
                },
                {
                    title: 'Preloader: pokazywać czy nie?',
                    desc: 'Pełnoekranowy ekran ładowania – dobra praktyka czy zasłona na wolną stronę?',
                    tags: { dyscyplina: 'UX Design', typ: 'Wzorzec', platforma: 'Web + Mobile', poziom: 'Średni' },
                    url: 'wpis-preloader.html',
                    icon: 'entry-hourglass',
                },
                {
                    title: 'Etykiety ikon w menu',
                    desc: 'Czy ikona w nawigacji powinna mieć etykietę tekstową, czy wystarczy sam symbol?',
                    tags: { dyscyplina: 'UI Design', typ: 'Wzorzec', platforma: 'Desktop + Mobile', poziom: 'Łatwy' },
                    url: 'wpis-etykiety-ikon.html',
                    icon: 'entry-tag',
                },
            ];

            const PAGE_SIZE = 6;

            const FILTER_DEFS = [
                { key: 'dyscyplina', label: 'Dyscyplina' },
                { key: 'typ', label: 'Typ wpisu' },
                { key: 'platforma', label: 'Platforma' },
                { key: 'poziom', label: 'Poziom' },
            ];

            const BADGE_COLOR = { dyscyplina: 'blue', typ: 'violet', platforma: 'green', poziom: 'amber' };
            const POZIOM_ORDER = { 'Łatwy': 1, 'Średni': 2, 'Trudny': 3 };

            const filtersEl = document.getElementById('katalogFilters');
            const clearBtn = document.getElementById('katalogClearFilters');
            const resultCountEl = document.getElementById('katalogResultCount');
            const gridEl = document.getElementById('katalogGrid');
            const emptyEl = document.getElementById('katalogEmpty');
            const paginationEl = document.getElementById('katalogPagination');
            const searchInput = document.getElementById('katalogSearchInput');
            const shortcut = document.getElementById('katalogShortcut');

            const activeFilters = { dyscyplina: '', typ: '', platforma: '', poziom: '' };
            let searchQuery = '';
            let currentPage = 1;

            function normalize(str) {
                return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            }

            // --- Budowa dropdownów filtrów (opcje liczone z realnych danych, nie
            // z sztywno wpisanej listy — każda opcja zawsze da ≥1 wynik i nowe
            // wpisy automatycznie poszerzą listę bez ręcznej synchronizacji). ---
            function buildFilters() {
                FILTER_DEFS.forEach((def) => {
                    let values = [...new Set(KATALOG_ENTRIES.map((e) => e.tags[def.key]))];
                    if (def.key === 'poziom') values.sort((a, b) => POZIOM_ORDER[a] - POZIOM_ORDER[b]);
                    else values.sort((a, b) => a.localeCompare(b, 'pl'));

                    const wrap = document.createElement('div');
                    wrap.className = 'katalog__filter';
                    wrap.dataset.filter = def.key;

                    const label = document.createElement('span');
                    label.className = 'katalog__filter-label';
                    label.textContent = def.label;
                    wrap.appendChild(label);

                    // Osobny wrapper wokół samego przycisku (nie całego wiersza z labelem) —
                    // panel opcji liczy swoją min-width względem TEGO kontenera, więc jest
                    // dokładnie tak szeroki jak przycisk, nie szerszy o etykietę z lewej.
                    // Panel NIE może być dzieckiem samego <button> — klik w opcję bąbelkowałby
                    // do handlera przycisku i natychmiast otwierał dropdown z powrotem.
                    const control = document.createElement('div');
                    control.className = 'katalog__filter-control';
                    wrap.appendChild(control);

                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'katalog__filter-select';
                    btn.setAttribute('aria-haspopup', 'listbox');
                    btn.setAttribute('aria-expanded', 'false');

                    const valueEl = document.createElement('span');
                    valueEl.className = 'katalog__filter-value';
                    valueEl.textContent = 'Wszystkie';
                    btn.appendChild(valueEl);

                    const chevron = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    chevron.setAttribute('class', 'katalog__filter-chevron');
                    chevron.setAttribute('viewBox', '0 0 8 5');
                    chevron.setAttribute('fill', 'none');
                    chevron.setAttribute('aria-hidden', 'true');
                    chevron.innerHTML = '<path d="M1 1L4 4L7 1" stroke="currentColor" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round" />';
                    btn.appendChild(chevron);
                    control.appendChild(btn);

                    const list = document.createElement('ul');
                    list.className = 'katalog__filter-options';
                    list.setAttribute('role', 'listbox');
                    list.hidden = true;

                    function renderOptions() {
                        list.innerHTML = '';
                        const all = ['', ...values];
                        all.forEach((val) => {
                            const li = document.createElement('li');
                            li.className = 'katalog__filter-option';
                            li.setAttribute('role', 'option');
                            li.setAttribute('aria-selected', String(activeFilters[def.key] === val));

                            const label = document.createElement('span');
                            label.textContent = val === '' ? 'Wszystkie' : val;
                            li.appendChild(label);

                            const check = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                            check.setAttribute('class', 'katalog__filter-option-check');
                            check.setAttribute('viewBox', '0 0 16 16');
                            check.setAttribute('fill', 'none');
                            check.setAttribute('aria-hidden', 'true');
                            check.innerHTML = '<path d="M3 8.5L6.2 11.7L13 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />';
                            li.appendChild(check);

                            li.addEventListener('click', () => {
                                activeFilters[def.key] = val;
                                valueEl.textContent = val === '' ? 'Wszystkie' : val;
                                renderOptions();
                                closeDropdown();
                                currentPage = 1;
                                render();
                            });
                            list.appendChild(li);
                        });
                    }
                    renderOptions();
                    control.appendChild(list);

                    function isOpen() { return !list.hidden; }
                    function openDropdown() {
                        closeAllDropdowns();
                        list.hidden = false;
                        btn.setAttribute('aria-expanded', 'true');
                    }
                    function closeDropdown() {
                        list.hidden = true;
                        btn.setAttribute('aria-expanded', 'false');
                    }
                    btn.addEventListener('click', () => { isOpen() ? closeDropdown() : openDropdown(); });
                    wrap._closeDropdown = closeDropdown;
                    wrap._renderOptions = renderOptions;

                    filtersEl.insertBefore(wrap, filtersEl.querySelector('.katalog__filters-meta'));
                });
            }

            function closeAllDropdowns() {
                filtersEl.querySelectorAll('.katalog__filter').forEach((wrap) => {
                    if (wrap._closeDropdown) wrap._closeDropdown();
                });
            }

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.katalog__filter')) closeAllDropdowns();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeAllDropdowns();
            });

            function refreshFilterOptionStates() {
                filtersEl.querySelectorAll('.katalog__filter').forEach((wrap) => {
                    if (wrap._renderOptions) wrap._renderOptions();
                });
            }

            clearBtn.addEventListener('click', () => {
                FILTER_DEFS.forEach((def) => { activeFilters[def.key] = ''; });
                filtersEl.querySelectorAll('.katalog__filter-value').forEach((el) => { el.textContent = 'Wszystkie'; });
                searchQuery = '';
                searchInput.value = '';
                currentPage = 1;
                refreshFilterOptionStates();
                render();
            });

            function poziomMeterSvg(poziom) {
                const filled = POZIOM_ORDER[poziom] || 1;
                const cx = [2.5, 10.5, 18.5];
                const circles = cx.map((x, i) => {
                    const fill = i < filled ? 'currentColor' : 'var(--badge-amber-border)';
                    return `<circle cx="${x}" cy="2.5" r="2.5" fill="${fill}" />`;
                }).join('');
                return `<svg width="21" height="5" viewBox="0 0 21 5" aria-hidden="true">${circles}</svg>`;
            }

            function dotSvg() {
                return '<svg width="6" height="6" viewBox="0 0 6 6" aria-hidden="true"><circle cx="3" cy="3" r="3" fill="currentColor" /></svg>';
            }

            function badgeHtml(kind, value) {
                if (kind === 'poziom') {
                    return `<span class="about__badge about__badge--${BADGE_COLOR[kind]} about__badge--meter">${poziomMeterSvg(value)}${value}</span>`;
                }
                return `<span class="about__badge about__badge--${BADGE_COLOR[kind]}">${dotSvg()}${value}</span>`;
            }

            function cardIconHtml(entry) {
                return `
                    <img class="featured__card-icon-img featured__card-icon-img--dark" src="assets/icons/entries/${entry.icon}.svg" alt="" />
                    <img class="featured__card-icon-img featured__card-icon-img--light" src="assets/icons/entries/${entry.icon}-light.svg" alt="" />`;
            }

            function cardHtml(entry) {
                return `
                    <a href="${entry.url}" class="featured__card">
                        <div class="featured__card-icon">${cardIconHtml(entry)}</div>
                        <div class="featured__card-content">
                            <div class="featured__card-text">
                                <h3 class="featured__card-title">${entry.title}</h3>
                                <p class="featured__card-desc">${entry.desc}</p>
                            </div>
                            <div class="featured__tags">
                                ${badgeHtml('dyscyplina', entry.tags.dyscyplina)}
                                ${badgeHtml('typ', entry.tags.typ)}
                                ${badgeHtml('platforma', entry.tags.platforma)}
                                ${badgeHtml('poziom', entry.tags.poziom)}
                            </div>
                        </div>
                    </a>`;
            }

            function getFiltered() {
                const q = normalize(searchQuery.trim());
                return KATALOG_ENTRIES.filter((entry) => {
                    for (const def of FILTER_DEFS) {
                        if (activeFilters[def.key] && entry.tags[def.key] !== activeFilters[def.key]) return false;
                    }
                    if (!q) return true;
                    const haystack = normalize([entry.title, entry.desc, Object.values(entry.tags).join(' ')].join(' '));
                    return haystack.includes(q);
                });
            }

            function arrowIconSvg(direction) {
                const d = direction === 'left'
                    ? 'M9.333 2.667L4 8L9.333 13.333M4 8H14'
                    : 'M6.667 2.667L12 8L6.667 13.333M12 8H2';
                return `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="${d}" stroke="currentColor" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
            }

            function renderPagination(totalPages) {
                paginationEl.innerHTML = '';
                if (totalPages <= 1) { paginationEl.hidden = true; return; }
                paginationEl.hidden = false;

                const prev = document.createElement('button');
                prev.type = 'button';
                prev.className = 'katalog__page-btn';
                prev.innerHTML = `${arrowIconSvg('left')}Poprzednia`;
                prev.disabled = currentPage === 1;
                prev.addEventListener('click', () => { currentPage -= 1; render(); });
                paginationEl.appendChild(prev);

                for (let p = 1; p <= totalPages; p += 1) {
                    const numBtn = document.createElement('button');
                    numBtn.type = 'button';
                    numBtn.className = 'katalog__page-number';
                    numBtn.textContent = String(p);
                    numBtn.setAttribute('aria-current', String(p === currentPage));
                    numBtn.addEventListener('click', () => { currentPage = p; render(); });
                    paginationEl.appendChild(numBtn);
                }

                const next = document.createElement('button');
                next.type = 'button';
                next.className = 'katalog__page-btn';
                next.innerHTML = `Następna${arrowIconSvg('right')}`;
                next.disabled = currentPage === totalPages;
                next.addEventListener('click', () => { currentPage += 1; render(); });
                paginationEl.appendChild(next);
            }

            function render() {
                const filtered = getFiltered();
                const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
                currentPage = Math.min(currentPage, totalPages);
                const start = (currentPage - 1) * PAGE_SIZE;
                const pageItems = filtered.slice(start, start + PAGE_SIZE);

                // Polska odmiana: 1 wynik, 2–4 wyniki (poza 12–14), reszta wyników.
                const n = filtered.length;
                const few = n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14);
                resultCountEl.textContent = n === 1 ? '1 wynik' : `${n} ${few ? 'wyniki' : 'wyników'}`;
                gridEl.innerHTML = pageItems.map(cardHtml).join('');
                emptyEl.classList.toggle('is-visible', filtered.length === 0);
                renderPagination(totalPages);
            }

            buildFilters();
            render();

            // Zwijanie filtrów tylko na mobile — na desktopie przycisk jest
            // ukryty przez CSS i filtry są zawsze widoczne (patrz styles.css).
            const filtersToggle = document.getElementById('katalogFiltersToggle');
            const MOBILE_QUERY = window.matchMedia('(max-width: 760px)');

            function syncFiltersCollapse() {
                if (MOBILE_QUERY.matches) {
                    filtersEl.classList.add('is-collapsed');
                    filtersToggle.setAttribute('aria-expanded', 'false');
                    filtersToggle.querySelector('span').textContent = 'Włącz filtry';
                } else {
                    filtersEl.classList.remove('is-collapsed');
                }
            }
            syncFiltersCollapse();
            MOBILE_QUERY.addEventListener('change', syncFiltersCollapse);

            filtersToggle.addEventListener('click', () => {
                const isCollapsed = filtersEl.classList.toggle('is-collapsed');
                filtersToggle.setAttribute('aria-expanded', String(!isCollapsed));
                filtersToggle.querySelector('span').textContent = isCollapsed ? 'Włącz filtry' : 'Ukryj filtry';
            });

            searchInput.addEventListener('input', () => { searchQuery = searchInput.value; currentPage = 1; render(); });
            // Klawiatury mobilne z autokorektą (Gboard/iOS) wysyłają tekst jako
            // "kompozycję" — bez tego filtrowanie odświeżało się dopiero po
            // zaakceptowaniu słowa przez klawiaturę systemową.
            searchInput.addEventListener('compositionupdate', () => { searchQuery = searchInput.value; currentPage = 1; render(); });
            searchInput.addEventListener('compositionend', () => { searchQuery = searchInput.value; currentPage = 1; render(); });

            const isMac = /Mac|iPod|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
            if (shortcut) shortcut.textContent = isMac ? '⌘K' : 'Ctrl+K';
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'k' && (isMac ? e.metaKey : e.ctrlKey)) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });
        })();
    </script>
</body>

</html>
